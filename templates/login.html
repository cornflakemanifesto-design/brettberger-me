<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — brettberger.me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<style>
  body { align-items: center; }
  .login-card { width: 100%; max-width: 360px; background: var(--card-bg); border: 1px solid var(--rule); border-radius: 12px; padding: 40px 32px; }
  .login-card h1 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0 0 24px; }
  label { display: block; font-size: 12px; color: var(--ink-soft); letter-spacing: 0.04em; margin-bottom: 8px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 6px; font-family: var(--sans); font-size: 15px; background: var(--bg); color: var(--ink); box-sizing: border-box; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; padding: 12px; margin-top: 18px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-family: var(--sans); font-size: 14px; font-weight: 500; }
  .error { color: var(--accent); font-size: 13px; margin: -8px 0 16px; }
</style>
</head>
<body>
  <main class="login-card">
    <h1>Sign in</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autofocus required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
